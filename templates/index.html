<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>TomBot Pokémon Tracker</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🃏</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard"><span class="dot"></span>TomBot<em>Tracker</em></a>
  <nav class="tabs">
    <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
    <a href="#/sets" data-tab="sets">Sets</a>
    <a href="#/cartas" data-tab="cartas">Cartas</a>
    <a href="#/missing" data-tab="missing">Faltantes</a>
  </nav>
  <div class="search-wrap">
    <input id="global-search" type="search" placeholder="Buscar carta…" autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
  </div>
</header>

<main id="view" class="view"><div class="loading">Cargando…</div></main>

<div id="modal-root" class="modal-root" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="/static/js/pokemon.js" type="module"></script>
</body>
</html>
