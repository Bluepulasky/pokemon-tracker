# TomBot Pokémon Tracker
#
#   cp .env.example .env      # edit APP_PORT / BIND_ADDR here
#   docker compose up -d
#
# Everything configurable lives in .env — this file should not need editing.

services:
  app:
    build: .
    image: tombot-tracker:latest
    container_name: tombot-tracker
    restart: unless-stopped

    # BIND_ADDR decides who can reach it:
    #   127.0.0.1  only this machine (default)
    #   0.0.0.0    anything on your LAN  <- set APP_TOKEN if you do this
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:${APP_PORT:-8080}"

    volumes:
      - ${DATA_PATH:-./data}:/srv/data
      - ${MEDIA_PATH:-./media}:/srv/media

    environment:
      PORT: "${APP_PORT:-8080}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"

      AUTO_BOOTSTRAP: "${AUTO_BOOTSTRAP:-1}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      WEB_THREADS: "${WEB_THREADS:-4}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-120}"

      APP_TOKEN: "${APP_TOKEN:-}"
      POKEMONTCG_API_KEY: "${POKEMONTCG_API_KEY:-}"
      CARDMARKET_LOCALE: "${CARDMARKET_LOCALE:-es}"
      PRICE_BASIS: "${PRICE_BASIS:-averageSellPrice}"
      PRICE_STALE_DAYS: "${PRICE_STALE_DAYS:-25}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"

  # Monthly price refresh + collection snapshot.
  # Its own container on purpose: an in-process scheduler inside gunicorn would
  # fire once per worker, so every price run would happen WEB_CONCURRENCY times.
  # Turn it off with:  docker compose up -d app
  scheduler:
    build: .
    image: tombot-tracker:latest
    container_name: tombot-scheduler
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      - app
    # Inherits the image's HEALTHCHECK, which probes the web port. This container
    # serves nothing, so without this it reports unhealthy forever.
    healthcheck:
      disable: true
    volumes:
      - ${DATA_PATH:-./data}:/srv/data
      - ${MEDIA_PATH:-./media}:/srv/media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      AUTO_BOOTSTRAP: "0"          # the app container owns bootstrapping
      RUN_ON_START: "${SCHEDULER_RUN_ON_START:-0}"
      SCHEDULER_CRON_DAY: "${SCHEDULER_CRON_DAY:-1}"
      SCHEDULER_CRON_HOUR: "${SCHEDULER_CRON_HOUR:-4}"
      POKEMONTCG_API_KEY: "${POKEMONTCG_API_KEY:-}"
      PRICE_BASIS: "${PRICE_BASIS:-averageSellPrice}"
      PRICE_STALE_DAYS: "${PRICE_STALE_DAYS:-25}"
