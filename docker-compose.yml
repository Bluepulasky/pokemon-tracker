# TomBot Pokémon Tracker
#
#   docker compose up -d
#
# Everything configurable lives in .env — this file should not need editing.

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-unknown}"
    image: tombot-tracker:latest
    container_name: tombot-tracker
    restart: unless-stopped

    # BIND_ADDR decides who can reach it:
    #   127.0.0.1  only this machine (default)
    #   0.0.0.0    anything on your LAN  <- set APP_TOKEN if you do this
    ports:
      - "8090:8080"

    volumes:
      - ${DATA_PATH:-./data}:/srv/data
      - ${MEDIA_PATH:-./media}:/srv/media
      # Read-only, and only so the app can report which commit it serves.
      # Mounting beats baking it in: it works with a plain `docker compose build`
      # rather than only with the make target that passes a build argument, and
      # an image reporting "unknown" cannot be told apart from one that was never
      # rebuilt. Harmless if the deployment is not a checkout — it reads
      # "unknown" again, which is the honest answer.
      - ./.git:/srv/.git:ro

    environment:
      PORT: "8080"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"

      AUTO_BOOTSTRAP: "${AUTO_BOOTSTRAP:-1}"
      WEB_THREADS: "${WEB_THREADS:-4}"
      WEB_TIMEOUT: "${WEB_TIMEOUT:-120}"

      APP_TOKEN: "${APP_TOKEN:-}"
      POKEMONTCG_API_KEY: "${POKEMONTCG_API_KEY:-}"
      # Metered: billed per request past the plan's daily allowance.
      TCGGO_API_KEY: "${TCGGO_API_KEY:-}"
      TCGGO_DAILY_LIMIT: "${TCGGO_DAILY_LIMIT:-40}"
      CARDMARKET_LOCALE: "${CARDMARKET_LOCALE:-es}"
      PRICE_BASIS: "${PRICE_BASIS:-averageSellPrice}"
      PRICE_STALE_DAYS: "${PRICE_STALE_DAYS:-25}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"

  # Monthly price refresh + collection snapshot.
  # Its own container on purpose: an in-process scheduler would tie the monthly
  # run to the web server's lifetime, and a restart mid-refresh would lose it.
  # Turn it off with:  docker compose up -d app
  scheduler:
    build: .
    image: tombot-tracker:latest
    container_name: tombot-scheduler
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      - app
    # Inherits the image's HEALTHCHECK, which probes the web port. This container
    # serves nothing, so without this it reports unhealthy forever.
    healthcheck:
      disable: true
    volumes:
      - ${DATA_PATH:-./data}:/srv/data
      - ${MEDIA_PATH:-./media}:/srv/media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      AUTO_BOOTSTRAP: "0"          # the app container owns bootstrapping
      RUN_ON_START: "${SCHEDULER_RUN_ON_START:-0}"
      SCHEDULER_CRON_DAY: "${SCHEDULER_CRON_DAY:-1}"
      SCHEDULER_CRON_HOUR: "${SCHEDULER_CRON_HOUR:-4}"
      POKEMONTCG_API_KEY: "${POKEMONTCG_API_KEY:-}"
      # Shares the same daily allowance as the app container: the count lives
      # in the database, so the two cannot each spend a full cap.
      TCGGO_API_KEY: "${TCGGO_API_KEY:-}"
      TCGGO_DAILY_LIMIT: "${TCGGO_DAILY_LIMIT:-40}"
      PRICE_BASIS: "${PRICE_BASIS:-averageSellPrice}"
      PRICE_STALE_DAYS: "${PRICE_STALE_DAYS:-25}"
